---
# Ansible Static Inventory — SarvaVaidya EHR
# Replace <EC2_PUBLIC_IP> with the Elastic IP from: terraform output ec2_public_ip
# In CI/CD, this file is generated dynamically from Terraform output.

all:
  vars:
    ansible_user: ec2-user
    ansible_ssh_private_key_file: "~/.ssh/sarvavaidya-keypair.pem"
    ansible_python_interpreter: /usr/bin/python3

  children:
    app_servers:
      hosts:
        sarvavaidya-app:
          ansible_host: 15.206.15.61

    # Separate group for DB ops (runs from EC2 via SSH tunnel — RDS is private)
    db_servers:
      hosts:
        sarvavaidya-app:                  # same host, DB is accessed from EC2
          ansible_host: 15.206.15.61
