---
# roles/nginx/tasks/main.yml
# Install and configure Nginx as a reverse proxy for SarvaVaidya

- name: Install Nginx
  ansible.builtin.dnf:
    name: nginx
    state: present
  become: true

- name: Deploy Nginx configuration from template
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/sarvavaidya.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  become: true
  notify: Reload nginx

- name: Start and enable Nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
  become: true

- name: Allow Nginx through firewall (if firewalld is running)
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
  become: true
  ignore_errors: true

handlers:
  - name: Reload nginx
    ansible.builtin.systemd:
      name: nginx
      state: reloaded
    become: true
