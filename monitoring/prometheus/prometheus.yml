# monitoring/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── SarvaVaidya Node.js API Metrics ──────────────────────────────────────────
  - job_name: "sarvavaidya-api"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          application: "sarvavaidya-ehr"
          environment: "local-monitoring"

  # ── Host / Node Exporter Metrics ─────────────────────────────────────────────
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "ehr-host"
