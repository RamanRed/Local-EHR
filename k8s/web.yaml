apiVersion: apps/v1
kind: Deployment
metadata:
  name: sarvavaidya-web
  namespace: sarvavaidya
  labels:
    app: sarvavaidya-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sarvavaidya-web
  template:
    metadata:
      labels:
        app: sarvavaidya-web
    spec:
      containers:
        - name: web
          image: sarvavaidya/web-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sarvavaidya-web
  namespace: sarvavaidya
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: sarvavaidya-web
