apiVersion: apps/v1
kind: Deployment
metadata:
  name: sarvavaidya-server
  namespace: sarvavaidya
  labels:
    app: sarvavaidya-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sarvavaidya-server
  template:
    metadata:
      labels:
        app: sarvavaidya-server
    spec:
      containers:
        - name: server
          image: sarvavaidya/api-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: sarvavaidya-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sarvavaidya-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sarvavaidya-secrets
                  key: JWT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sarvavaidya-secrets
                  key: GEMINI_API_KEY
            - name: GROK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sarvavaidya-secrets
                  key: GROK_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: sarvavaidya-server
  namespace: sarvavaidya
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: sarvavaidya-server
