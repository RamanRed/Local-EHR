apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sarvavaidya-ingress
  namespace: sarvavaidya
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: sarvavaidya.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sarvavaidya-server
                port:
                  number: 3001
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: sarvavaidya-server
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sarvavaidya-web
                port:
                  number: 80
