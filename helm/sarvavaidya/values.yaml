# Default values for SarvaVaidya Helm Chart
global:
  environment: production
  domain: sarvavaidya.local

# ── Server (Express 5 API) ───────────────────────────────────────────────────
server:
  replicaCount: 2
  image:
    repository: sarvavaidya/api-server
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 3001
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 150m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

# ── Web (React 19 Frontend) ──────────────────────────────────────────────────
web:
  replicaCount: 2
  image:
    repository: sarvavaidya/web-client
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
  hosts:
    - host: sarvavaidya.local
      paths:
        - path: /api
          pathType: Prefix
          service: server
        - path: /ws
          pathType: Prefix
          service: server
        - path: /
          pathType: Prefix
          service: web

# ── PostgreSQL Database ──────────────────────────────────────────────────────
database:
  enabled: true
  storage: 10Gi
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 100m
