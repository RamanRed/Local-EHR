apiVersion: v1
kind: Service
metadata:
  name: {{ include "sarvavaidya.fullname" . }}-web
  labels:
    {{- include "sarvavaidya.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      name: http
  selector:
    app: {{ include "sarvavaidya.fullname" . }}-web
