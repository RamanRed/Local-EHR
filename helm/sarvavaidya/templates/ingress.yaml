{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sarvavaidya.fullname" . }}-ingress
  labels:
    {{- include "sarvavaidya.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "sarvavaidya.fullname" $ }}-{{ .service }}
                port:
                  number: {{ eq .service "server" | ternary $.Values.server.service.port $.Values.web.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
