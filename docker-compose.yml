services:
  postgres:
    image: postgres:16-alpine
    container_name: sarvavaidya-db
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: sarvavaidya
      POSTGRES_PASSWORD: sarvavaidya
      POSTGRES_DB: sarvavaidya
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
